# Conda environment for WhisperX.
#
#   conda env create -f environment/whisperx.yml
#   conda activate whisperx
#   whisperx --help
#
# This installs the CPU build. For an NVIDIA GPU, install a CUDA build of
# PyTorch first (see https://pytorch.org/get-started/locally/), then
# `pip install whisperx` into the same environment, and set
# device = "cuda", compute_type = "float16" in run_pipeline.R.
name: whisperx
channels:
  - conda-forge
dependencies:
  - python=3.10
  - ffmpeg
  - pip
  - pip:
      - whisperx
